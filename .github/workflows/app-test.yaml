name: App / Test

on:
  push:
    branches:
      - master
      - release-*
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install browser test dependencies
        run: |
          python3 -m venv build/browser-tests
          build/browser-tests/bin/pip install -r tests/requirements.txt
          build/browser-tests/bin/python -m playwright install --with-deps chromium
      - name: Test APK-contained web navigation
        run: build/browser-tests/bin/python tests/test_navigation.py
      - name: Run test task
        run: ./gradlew test
